<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events Management | Admin Portal</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-brand">
        <img src="../assets/images/logo.png" alt="Libin Catering">
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="menu.html" class="admin-nav-link"><i class="bi bi-book"></i> Menu Items</a>
        <a href="categories.html" class="admin-nav-link"><i class="bi bi-tags"></i> Categories</a>
        <a href="events.html" class="admin-nav-link active"><i class="bi bi-calendar-event"></i> Events</a>
        <a href="enquiries.html" class="admin-nav-link"><i class="bi bi-envelope-paper"></i> Enquiries</a>
        <a href="gallery.html" class="admin-nav-link"><i class="bi bi-images"></i> Gallery</a>
        <a href="contact.html" class="admin-nav-link"><i class="bi bi-geo-alt"></i> Contact Info</a>
        <hr class="my-3 border-secondary">
        <a href="../index.html" target="_blank" class="admin-nav-link"><i class="bi bi-box-arrow-up-right"></i> View Live Site</a>
        <a href="#" class="admin-nav-link text-danger" data-action="admin-logout"><i class="bi bi-box-arrow-left text-danger"></i> Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
      <header class="admin-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm btn-outline-dark d-lg-none" id="toggleSidebar">
            <i class="bi bi-list fs-5"></i>
          </button>
          <h4 class="font-serif mb-0">Events & Banquets Showcase</h4>
        </div>
        <button class="btn btn-gold btn-sm" id="btnAddEvent">
          <i class="bi bi-plus-lg me-1"></i> Add Event
        </button>
      </header>

      <div class="admin-main-container">
        <div class="admin-card">
          <div class="admin-card-header">
            <h5 class="font-serif mb-0">All Showcased Events</h5>
          </div>
          <div class="admin-card-body p-0">
            <div class="table-responsive">
              <table class="table table-custom table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>Cover</th>
                    <th>Title & Location</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Guest Count</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="adminEventTableBody">
                  <!-- Rendered via js/event-admin.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Event Modal -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-noir text-white py-3">
          <h5 class="modal-title font-serif" id="modalTitle">Add Event</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 bg-white">
          <form id="eventForm">
            <input type="hidden" id="eventId">

            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label">Event Title *</label>
                <input type="text" id="eventTitle" class="form-control" placeholder="e.g. Royal Heritage Wedding Banquet" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Event Type *</label>
                <select id="eventType" class="form-select" required>
                  <option value="Wedding">Wedding</option>
                  <option value="Reception">Reception</option>
                  <option value="Corporate Catering">Corporate Catering</option>
                  <option value="Custom Events">Custom Events</option>
                  <option value="Housewarming">Housewarming</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label">Event Date</label>
                <input type="date" id="eventDate" class="form-control">
              </div>
              <div class="col-md-4">
                <label class="form-label">Location / City</label>
                <input type="text" id="eventLocation" class="form-control" placeholder="e.g. Nagercoil">
              </div>
              <div class="col-md-4">
                <label class="form-label">Guest Count</label>
                <input type="number" id="eventGuestCount" class="form-control" placeholder="e.g. 1200">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Event Cover Photo (Upload File or Enter URL)</label>
              <div class="row g-2 align-items-center mb-2">
                <div class="col-md-6">
                  <input type="file" id="eventFileInput" class="form-control" accept="image/*">
                  <small class="text-muted">Upload photo from device</small>
                </div>
                <div class="col-md-6">
                  <input type="url" id="eventCoverImageUrl" class="form-control" placeholder="Or paste image URL (https://...)">
                  <small class="text-muted">Or web image link</small>
                </div>
              </div>
              <div id="eventImagePreviewWrap" class="mt-2 p-2 bg-light rounded text-center" style="display: none;">
                <img id="eventImagePreview" src="" alt="Preview" class="rounded shadow-sm" style="max-height: 130px; width: auto;">
                <div class="small text-muted mt-1">Event Cover Preview</div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Event Description</label>
              <textarea id="eventDescription" class="form-control" rows="3" placeholder="Brief summary of setup, dishes served, and arrangements..."></textarea>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label">Display Order</label>
                <input type="number" id="eventDisplayOrder" class="form-control" value="0">
              </div>
              <div class="col-md-4 d-flex align-items-center pt-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="eventIsFeatured">
                  <label class="form-check-label" for="eventIsFeatured">Featured</label>
                </div>
              </div>
              <div class="col-md-4 d-flex align-items-center pt-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="eventIsPublished" checked>
                  <label class="form-check-label" for="eventIsPublished">Published (Public)</label>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-gold">Save Event</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/event-admin.js"></script>

  <script>
    document.getElementById('toggleSidebar')?.addEventListener('click', () => {
      document.getElementById('adminSidebar')?.classList.toggle('show');
    });
  </script>
</body>
</html>
