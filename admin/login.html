<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Libin Catering Service & Event Management</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #101114 0%, #1a1c23 100%);
      padding: 1.5rem;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="login-card animate-fade-in-up">
    <div class="text-center mb-4">
      <img src="../assets/images/logo.svg" alt="Libin Catering" class="mb-3" style="height: 56px; width: auto; max-width: 100%;">
      <h3 class="font-serif fw-bold mb-1">Administrative Portal</h3>
      <p class="text-muted small">Sign in to manage catering menus, events & customer enquiries.</p>
    </div>

    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="form-label">Admin Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope-fill text-muted"></i></span>
          <input type="email" id="loginEmail" class="form-control border-start-0" placeholder="admin@libincatering.com" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
          <input type="password" id="loginPassword" class="form-control border-start-0" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-gold w-100 py-3 mb-3">
        <i class="bi bi-shield-lock-fill me-2"></i> Authenticate & Enter
      </button>

      <div class="text-center">
        <a href="../index.html" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Return to Main Website
        </a>
      </div>
    </form>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...`;

      try {
        await window.handleAdminLogin(email, password);
        window.location.replace('dashboard.html');
      } catch (err) {
        alert(err.message || 'Authentication failed. Please verify credentials.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
