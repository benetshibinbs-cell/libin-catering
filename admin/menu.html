<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management | Admin Portal</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-brand">
        <img src="../assets/images/logo-white.svg" alt="Libin Catering">
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="menu.html" class="admin-nav-link active"><i class="bi bi-book"></i> Menu Items</a>
        <a href="categories.html" class="admin-nav-link"><i class="bi bi-tags"></i> Categories</a>
        <a href="events.html" class="admin-nav-link"><i class="bi bi-calendar-event"></i> Events</a>
        <a href="enquiries.html" class="admin-nav-link"><i class="bi bi-envelope-paper"></i> Enquiries</a>
        <a href="gallery.html" class="admin-nav-link"><i class="bi bi-images"></i> Gallery</a>
        <a href="contact.html" class="admin-nav-link"><i class="bi bi-geo-alt"></i> Contact Info</a>
        <hr class="my-3 border-secondary">
        <a href="../index.html" target="_blank" class="admin-nav-link"><i class="bi bi-box-arrow-up-right"></i> View Live Site</a>
        <a href="#" class="admin-nav-link text-danger" data-action="admin-logout"><i class="bi bi-box-arrow-left text-danger"></i> Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
      <header class="admin-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm btn-outline-dark d-lg-none" id="toggleSidebar">
            <i class="bi bi-list fs-5"></i>
          </button>
          <h4 class="font-serif mb-0">Menu Management</h4>
        </div>
        <button class="btn btn-gold btn-sm" id="btnAddMenuItem">
          <i class="bi bi-plus-lg me-1"></i> Add Menu Item
        </button>
      </header>

      <div class="admin-main-container">
        <div class="admin-card">
          <div class="admin-card-header">
            <h5 class="font-serif mb-0">Dishes & Culinary Items</h5>
          </div>
          <div class="admin-card-body p-0">
            <div class="table-responsive">
              <table class="table table-custom table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>Image</th>
                    <th>Dish Name</th>
                    <th>Category</th>
                    <th>Diet</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="adminMenuTableBody">
                  <!-- Rendered via js/menu-admin.js -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Menu Item Modal -->
  <div class="modal fade" id="menuItemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-noir text-white py-3">
          <h5 class="modal-title font-serif" id="modalTitle">Add Menu Item</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 bg-white">
          <form id="menuItemForm">
            <input type="hidden" id="itemId">

            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label">Dish Name *</label>
                <input type="text" id="itemName" class="form-control" placeholder="e.g. Signature Mutton Dum Biryani" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Category *</label>
                <select id="itemCategory" class="form-select" required>
                  <!-- Populated dynamically -->
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label">Dietary Type *</label>
                <select id="itemDietary" class="form-select" required>
                  <option value="veg">Vegetarian</option>
                  <option value="non-veg" selected>Non-Vegetarian</option>
                  <option value="egg">Egg</option>
                  <option value="halal">Halal Certified</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" id="itemPrice" class="form-control" placeholder="Leave empty for enquire">
              </div>
              <div class="col-md-4 d-flex align-items-end pb-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="itemEnquirePrice" checked>
                  <label class="form-check-label small" for="itemEnquirePrice">Price on Enquiry</label>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Image URL (Unsplash or Supabase Storage)</label>
              <input type="url" id="itemImageUrl" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea id="itemDescription" class="form-control" rows="3" placeholder="Aromatic ingredients, slow-cooked spices, etc."></textarea>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label">Display Order</label>
                <input type="number" id="itemDisplayOrder" class="form-control" value="0">
              </div>
              <div class="col-md-4 d-flex align-items-center pt-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="itemFeatured">
                  <label class="form-check-label" for="itemFeatured">Featured on Home</label>
                </div>
              </div>
              <div class="col-md-4 d-flex align-items-center pt-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="itemAvailable" checked>
                  <label class="form-check-label" for="itemAvailable">Available / Active</label>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-gold">Save Menu Item</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu-admin.js"></script>

  <script>
    document.getElementById('toggleSidebar')?.addEventListener('click', () => {
      document.getElementById('adminSidebar')?.classList.toggle('show');
    });
  </script>
</body>
</html>
