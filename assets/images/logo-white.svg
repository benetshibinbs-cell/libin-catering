<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae896"/>
      <stop offset="50%" stop-color="#dfba53"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
    <filter id="glowWhite" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Chef Icon -->
  <g transform="translate(10, 10)" filter="url(#glowWhite)">
    <!-- Chef Hat -->
    <path d="M42,22 C38,12 50,6 56,12 C62,4 74,8 74,18 C78,16 84,22 80,28 C74,32 44,30 42,22 Z" fill="#dfba53" stroke="#101114" stroke-width="2"/>
    <path d="M46,28 L76,28 L74,36 L48,36 Z" fill="#ffffff" stroke="#101114" stroke-width="2"/>
    
    <!-- Chef Face / Head -->
    <circle cx="58" cy="42" r="7" fill="#fae896" stroke="#101114" stroke-width="1.8"/>
    
    <!-- Running Body -->
    <path d="M54,49 L46,65 L52,72 L62,56 Z" fill="#ffffff" stroke="#101114" stroke-width="2"/>
    
    <!-- Running Legs -->
    <path d="M46,65 L32,74 L20,72 L16,78" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52,72 L60,86 L74,88" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arm Holding Cloche Tray -->
    <path d="M58,52 L70,48 L82,44" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Serving Cloche / Platter -->
    <path d="M72,42 L98,42" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M75,41 C75,28 95,28 95,41 Z" fill="url(#goldGradWhite)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="85" cy="27" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <!-- Line 1: LIBIN CATERING SERVICE -->
  <text x="115" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="url(#goldGradWhite)" stroke="#101114" stroke-width="1.5" letter-spacing="0.5" style="paint-order: stroke fill;">
    LIBIN CATERING SERVICE
  </text>

  <!-- Line 2: & EVENT MANAGEMENT -->
  <text x="118" y="88" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="25" fill="#ffffff" letter-spacing="4.5">
    &amp; EVENT MANAGEMENT
  </text>
  
  <!-- Subtle decorative gold accent line under subtitle -->
  <line x1="118" y1="96" x2="505" y2="96" stroke="url(#goldGradWhite)" stroke-width="2" stroke-linecap="round"/>
</svg>
